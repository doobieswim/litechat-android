name: Build LiteChat APK

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  # Fast fail before paying for a Gradle run: pure-Python checks, no SDK.
  static-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Static verification (no SDK needed)
        run: python3 scripts/verify_static.py

  build:
    runs-on: ubuntu-latest
    needs: static-verify
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Grant execute
        run: chmod +x gradlew || true
      - name: Assemble both flavors (release)
        run: |
          if [ -f gradlew ] && [ -f gradle/wrapper/gradle-wrapper.jar ]; then
            ./gradlew assembleFossRelease assemblePlayRelease --stacktrace
          else
            gradle wrapper --gradle-version 8.11.1
            ./gradlew assembleFossRelease assemblePlayRelease --stacktrace
          fi
      - name: Unit tests
        run: ./gradlew testFossReleaseUnitTest testPlayReleaseUnitTest
      - name: APK size gate (small-APK law, each flavor)
        run: |
          for APK in $(find app/build/outputs/apk -name '*.apk' | sort); do
            SIZE=$(stat -c%s "$APK")
            MAX=$((20 * 1024 * 1024))
            echo "APK: $APK size: $((SIZE / 1024 / 1024))MB"
            if [ "$SIZE" -gt "$MAX" ]; then
              echo "::error::$APK ${SIZE} bytes exceeds ${MAX} byte (20MB) gate"
              exit 1
            fi
          done
          test -n "$(find app/build/outputs/apk -name '*.apk' | head -1)" || { echo "::error::No APK produced"; exit 1; }
      - uses: actions/upload-artifact@v4
        with:
          name: litechat-apks
          path: app/build/outputs/apk/**/*.apk

  # Tag v* → signed release + GitHub Release with both APKs attached.
  publish:
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Grant execute
        run: chmod +x gradlew || true
      - name: Assemble signed release (both flavors)
        env:
          STORE_FILE: ${{ secrets.KEYSTORE_FILE }}
          STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEYSTORE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEYSTORE_KEY_PASSWORD }}
        run: |
          if [ -n "$STORE_FILE" ]; then
            # Signing config is wired in build.gradle.kts when KEYSTORE_FILE env is set.
            ./gradlew assembleFossRelease assemblePlayRelease --stacktrace
          else
            echo "No signing secrets — building unsigned (release will be unsigned)."
            ./gradlew assembleFossRelease assemblePlayRelease --stacktrace
          fi
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/**/*.apk
          generate_release_notes: true
