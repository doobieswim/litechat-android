name: Build LiteChat APK

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  # Fast fail before paying for a Gradle run: pure-Python checks, no SDK.
  static-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Static verification (no SDK needed)
        run: python3 scripts/verify_static.py

  build:
    runs-on: ubuntu-latest
    needs: static-verify
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Grant execute
        run: chmod +x gradlew || true
      - name: Assemble release
        run: |
          if [ -f gradlew ] && [ -f gradle/wrapper/gradle-wrapper.jar ]; then
            ./gradlew assembleRelease --stacktrace
          else
            gradle wrapper --gradle-version 8.11.1
            ./gradlew assembleRelease --stacktrace
          fi
      - name: APK size gate (small-APK law)
        run: |
          APK=$(find app/build/outputs/apk -name '*.apk' | head -1)
          test -n "$APK" || { echo "::error::No APK produced"; exit 1; }
          SIZE=$(stat -c%s "$APK")
          MAX=$((20 * 1024 * 1024))
          echo "APK: $APK size: $((SIZE / 1024 / 1024))MB"
          if [ "$SIZE" -gt "$MAX" ]; then
            echo "::error::Release APK ${SIZE} bytes exceeds ${MAX} byte (20MB) gate"
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: litechat-apk
          path: app/build/outputs/apk/**/*.apk
