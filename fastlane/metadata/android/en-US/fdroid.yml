AutoName: BYO AI
Summary: Thin BYOK AI chat client for Android. Bring your own OpenAI-compatible key.
Description: |
  BYO AI is a lightweight, open-source AI chat client for Android.
  
  Features:
  - BYOK (Bring Your Own Key) — use OpenAI, OpenRouter, Groq, Ollama, or any OpenAI-compatible API
  - Streaming responses with markdown rendering
  - Image generation via /imagine command
  - Web browsing via /browse command
  - Prompt templates with variables
  - Honest compatibility matrix — shows if your phone can run it
  - Built for a $30 phone — works on 4GB phones (e.g. Moto G 2025)
  - One-time $4.99 Pro removes ads and unlocks premium features
  - FOSS flavor available (no Google Play Services)
  
  No accounts, no subscriptions, no data collection. Your API key, your endpoint, your device.

