AutoName: BYO AI
Summary: Thin BYOK AI chat client for Android. Bring your own OpenAI-compatible key.
Description: |
  BYO AI is a lightweight, open-source chat client for Android that connects to
  OpenAI-compatible AI services using your own API key.

  No accounts. No subscriptions. No tracking. Your key stays on your phone,
  encrypted. Your chats go straight from your phone to the AI service you chose.

  Features:
  - Bring your own key: OpenAI, OpenRouter, Groq, Ollama, LM Studio, or any OpenAI-compatible endpoint
  - Streaming chat responses
  - Image generation (/imagine) and video generation (/video) through your own provider
  - Web browsing (/browse) and image attachment for vision models
  - Voice input, prompt templates, conversation forks, chat backup and restore
  - Honest compatibility matrix: tells you plainly if your phone can handle it
  - Built for a $30 phone: small (~2 MB), fast, works on 4GB phones
  - Works with a local Ollama server on your network

  This build has no ads, no Google Play services, and no billing. Free forever.

RepoType: git
Repo: https://github.com/flamingspade1995-coder/litechat-android

Builds:
  - versionName: '1.0.0'
    versionCode: 1
    commit: <FULL_SHA_OF_v1.0.0_TAG>   # F-Droid rejects branch names — substitute the tag's full SHA at submission
    gradle:
      - foss

AntiFeatures:
  - NonFreeNet # app connects to user-chosen proprietary AI APIs by default

ArchivePolicy: 0
AutoUpdateMode: Version
UpdateCheckMode: Tags
CurrentVersion: 1.0.0
CurrentVersionCode: 1
