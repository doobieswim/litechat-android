# Build tuning: modest heap works on the 4GB VPS (in-process Kotlin) and on
# CI runners. -Xmx1536m keeps the daemon under a 4GB host's pressure while
# giving the Kotlin compiler enough on GitHub's 7GB runners.
org.gradle.jvmargs=-Xmx1536m -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true
org.gradle.parallel=false
org.gradle.caching=true
org.gradle.workers.max=2
kotlin.compiler.execution.strategy=in-process
