# Weak-host build tuning (this VPS has 4GB RAM): single in-process Kotlin
# compiler, small heap, no parallel workers. Harmless on CI (7GB runners).
org.gradle.jvmargs=-Xmx512m -XX:MaxMetaspaceSize=256m -Dfile.encoding=UTF-8
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true
org.gradle.parallel=false
org.gradle.caching=true
org.gradle.workers.max=2
kotlin.compiler.execution.strategy=in-process
