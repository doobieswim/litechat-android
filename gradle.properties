# Build tuning for the 4GB VPS: 768m heap + 512m metaspace keeps the daemon
# around 1GB RSS, leaving ~2.5GB for the gateway + TUI + agent.
# CI can override to -Xmx1536m via ORG_GRADLE_PROJECT_org.gradle.jvmargs env.
org.gradle.jvmargs=-Xmx768m -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true
org.gradle.parallel=false
org.gradle.caching=true
org.gradle.workers.max=2
kotlin.compiler.execution.strategy=in-process
